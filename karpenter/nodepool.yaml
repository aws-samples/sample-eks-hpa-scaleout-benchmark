# Karpenter NodePool — NO capacity buffer (cold provisioning arm).
# Karpenter v1 API (karpenter.sh/v1). Verify against your installed Karpenter version.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: benchmark
spec:
  template:
    metadata:
      labels: { role: benchmark }
    spec:
      # Taint benchmark nodes app-only so loaders/other pods never land here and pollute
      # the CPU we measure. The app Deployment tolerates this taint (see workload/deployment.yaml).
      taints:
        - key: dedicated
          value: benchmark
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["m6i.large", "m6i.xlarge", "m6i.2xlarge"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  limits:
    cpu: "1000"
  disruption:
    # Consolidation OFF during benchmarks: node churn mid-run disrupts app pods and makes
    # TTR unmeasurable (observed live). Nodes stay put for the duration of a measured run.
    consolidationPolicy: WhenEmpty
    consolidateAfter: Never
